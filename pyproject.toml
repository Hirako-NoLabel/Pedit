[build-system]
requires = ["setuptools>=77,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pedit-oss"
version = "0.1.0"
description = "Local-first PDF visual editor with Original Glyph Reuse"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Pedit contributors"}]
dependencies = [
  "PyMuPDF>=1.26,<2",
  "Pillow>=10,<12",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
ocr = ["rapidocr==3.9.2", "onnxruntime>=1.20,<2", "pytesseract>=0.3.13,<1"]
dev = ["pytest>=8,<10", "ruff==0.16.7", "build>=1.2,<2", "twine>=6,<8"]

[project.scripts]
pedit = "pedit.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pedit = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs/archive"]

[tool.ruff.lint]
# Gate actual runtime errors first; avoid wholesale formatting of the legacy engine.
select = ["E9", "F63", "F7", "F82"]
